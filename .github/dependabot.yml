# #1772: keeps the GitHub Action pins (#1756) fresh. One grouped PR a week into `next`;
# dependabot-automerge.yml turns on auto-merge, so it ships on green CI like any low-risk PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
    commit-message:
      prefix: "#1772 actions"
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /
    target-branch: next
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    groups:
      compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Match the deployed Node major, not the newest Node release.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    labels: [dependencies]
    commit-message:
      prefix: "#2910 npm"
    open-pull-requests-limit: 5
