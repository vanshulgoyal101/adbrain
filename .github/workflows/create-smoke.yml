name: Create smoke
# #2145: makes 3 ads on production every 2 hours as the smoke account, so a dead picture provider fails a check
# instead of waiting for someone to walk into it. Free pictures only: smoke-core.mjs refuses before any paid
# request unless the account is internal and not exempt. The words are written on the normal (paid) text models.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # A timed-out job opens no issue (#2029): every step is bounded and they sum to at most this.
    timeout-minutes: 50
    # Never two at once (one paid text run each); a queued run waits, never cancels the running one.
    concurrency:
      group: create-smoke
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        timeout-minutes: 8
      # Same bounded install as the Production guard (#210).
      - name: Install Chromium (apt bounded, then browser only)
        timeout-minutes: 14
        run: |
          timeout -k 30s 8m npx playwright install --with-deps chromium && exit 0
          echo "::warning::playwright install --with-deps did not finish in 8 min; installing Chromium without OS packages"
          timeout -k 30s 4m npx playwright install chromium
      # No retry: each attempt is another paid text run. The run's ads and pictures are deleted after a PASS.
      - name: Create smoke (free pictures, deletes its ads)
        timeout-minutes: 15
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_CREATE_CLEANUP: "1"
        run: |
          rc=0; timeout -k 30s 14m node scripts/smoke-core.mjs --create | tee smoke.txt || rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then echo "FAIL smoke did not finish in 14 min" | tee -a smoke.txt; fi
          exit "$rc"
      - name: Alert on failure
        timeout-minutes: 2
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          smoke=$(grep -E '^(PASS|FAIL|NOTE)' smoke.txt 2>/dev/null || echo "smoke did not run; see the run log")
          body="$(printf 'Run: %s\n\n```\n%s\n```\nFree pictures are the usual cause (#2145). A FAIL Create with saved ads keeps them in the smoke workspace; a FAIL Cleanup leaves the ads of that run in Review.\n' "$run" "$smoke")"
          # One open alert at a time: a repeat failure comments on it.
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Create smoke failed"' --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" -b "$(printf 'Failed again (%s).\n\n%s' "$GITHUB_EVENT_NAME" "$body")"
          else
            gh issue create -R "$GITHUB_REPOSITORY" -l core -l bug -l owner:devops -t "Create smoke failed in production" -b "$body"
          fi
      - name: Note recovery on the open alert
        timeout-minutes: 2
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Create smoke failed"' --json number --jq '.[0].number // empty')
          [ -n "$open" ] || exit 0
          last=$(gh issue view "$open" -R "$GITHUB_REPOSITORY" --json comments --jq '.comments[-1].body // ""')
          [[ "$last" == "Create smoke passed again"* ]] || gh issue comment "$open" -R "$GITHUB_REPOSITORY" -b "Create smoke passed again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
