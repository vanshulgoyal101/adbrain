name: Production guard
on:
  deployment_status:
  schedule:
    - cron: "30 3 * * *" # daily read-only core smoke
  workflow_dispatch:
    inputs:
      force_fail:
        description: Replace the smoke with a FAIL line to prove the guard goes red (no rollback on dispatch)
        type: boolean
        default: false
      drill:
        description: Rollback drill (#111) - force a FAIL, roll production back and open a [DRILL] core bug
        type: boolean
        default: false
permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: >-
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
      && github.event.deployment.environment == 'Production')
      || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A timed-out job opens no issue (#210), so every step has its own bound and they sum to at most
    # this (#2029). Wait/served and WS1/rollback never both run, so the real worst case is ~80 min.
    timeout-minutes: 95
    concurrency: production-smoke
    # Explicit bash adds pipefail, so `| tee` cannot hide a failed smoke or rollback (#153).
    defaults:
      run:
        shell: bash
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SHA: ${{ github.event.deployment.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        timeout-minutes: 8
      # The Azure apt mirror has stalled at ~20 kB/s for 11-15 min (#210); the browser CDN is fast.
      - name: Install Chromium (apt bounded, then browser only)
        id: install
        timeout-minutes: 14
        run: |
          timeout -k 30s 8m npx playwright install --with-deps chromium && exit 0
          echo "::warning::playwright install --with-deps did not finish in 8 min; installing Chromium without OS packages"
          echo "deps=missing" >> "$GITHUB_OUTPUT"
          timeout -k 30s 4m npx playwright install chromium
      - name: Wait until production serves this commit
        id: wait
        timeout-minutes: 7
        if: github.event_name == 'deployment_status' && env.VERCEL_TOKEN != ''
        run: node scripts/production-guard.mjs wait "$SHA"
      # No token (CEO, #413): fix forward, no rollback. #1457: wait until the domain's X-AdBrain-Release is this commit
      # (or a newer one, whose own run smokes it); fail if it never is, so a pinned domain can't pass a smoke of an old build.
      - name: Wait until the domain serves this commit (no token)
        id: served
        timeout-minutes: 14
        if: github.event_name == 'deployment_status' && env.VERCEL_TOKEN == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-guard.mjs served "$SHA" | tee smoke.txt
      - name: Read-only core smoke (one retry)
        id: smoke
        timeout-minutes: 23
        if: steps.wait.outputs.superseded != 'true' && steps.served.outputs.superseded != 'true'
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          FORCE_FAIL: ${{ (inputs.force_fail || inputs.drill) && 'true' || '' }}
        run: |
          smoke() {
            if [ -n "$FORCE_FAIL" ]; then echo "FAIL forced by dispatch"; return 1; fi
            rc=0; timeout -k 30s 10m node scripts/smoke-core.mjs || rc=$?
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then echo "FAIL smoke did not finish in 10 min"; fi
            return "$rc"
          }
          smoke | tee smoke.txt && exit 0
          sleep 60
          smoke | tee smoke.txt
      - name: WS1 first-timer walk (#1439)
        timeout-minutes: 10
        if: steps.smoke.outcome == 'success'
        env:
          WS1_EMAIL: ${{ secrets.WS1_EMAIL }}
          WS1_PASSWORD: ${{ secrets.WS1_PASSWORD }}
        run: |
          [ -n "$WS1_EMAIL" ] || { echo "WS1_EMAIL not set; WS1 walk skipped"; exit 0; }
          set -o pipefail
          rc=0; timeout -k 30s 9m npx tsx scripts/ws1-walk.mts | tee ws1.txt || rc=$?
          { echo '### WS1 walk'; echo '```'; cat ws1.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Roll production back
        timeout-minutes: 6
        if: failure() && steps.smoke.outcome == 'failure' && steps.install.outputs.deps != 'missing' && (github.event_name == 'deployment_status' || inputs.drill) && env.VERCEL_TOKEN != ''
        run: node scripts/production-guard.mjs rollback "$SHA" 2>&1 | tee rollback.txt
      - name: Open core bug
        timeout-minutes: 4
        if: failure() && !inputs.force_fail
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ inputs.drill && '[DRILL] ' || '' }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          smoke=$(grep -E '^(PASS|FAIL)' smoke.txt 2>/dev/null || echo "smoke did not run; see the run log")
          rollback=$(cat rollback.txt 2>/dev/null || echo "not attempted (scheduled run, install or wait failed, Chromium OS packages missing, or no VERCEL_TOKEN)")
          # Public repo: never post anything token-shaped (#413).
          rollback=$(sed -E 's/\b(vc[a-z])_[A-Za-z0-9]{16,}/\1_[redacted]/g; s/--token[= ][^ ]+/--token [redacted]/g' <<<"$rollback")
          body="$(printf 'Run: %s\n\nSmoke:\n```\n%s\n```\nRollback:\n```\n%s\n```\nRecovery: docs/RELEASING.md#production-guard\n' "$run" "$smoke" "$rollback")"
          # One open alert at a time: a repeat failure comments on it instead of opening another.
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"${PREFIX}Production smoke failed on\"" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" -b "$(printf 'Failed again on %s (%s).\n\n%s' "${SHA::7}" "$GITHUB_EVENT_NAME" "$body")"
          else
            gh issue create -R "$GITHUB_REPOSITORY" -l core -l bug -l owner:devops \
              -t "${PREFIX}Production smoke failed on ${SHA::7} ($GITHUB_EVENT_NAME)" -b "$body"
          fi
