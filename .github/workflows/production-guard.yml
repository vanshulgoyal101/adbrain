name: Production guard
on:
  deployment_status:
  schedule:
    - cron: "30 3 * * *" # daily read-only core smoke
  workflow_dispatch:
    inputs:
      force_fail:
        description: Replace the smoke with a FAIL line to prove the guard goes red (no rollback on dispatch)
        type: boolean
        default: false
permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: >-
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
      && github.event.deployment.environment == 'Production')
      || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency: production-smoke
    # Explicit bash adds pipefail, so `| tee` cannot hide a failed smoke or rollback (#153).
    defaults:
      run:
        shell: bash
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SHA: ${{ github.event.deployment.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait until production serves this commit
        id: wait
        if: github.event_name == 'deployment_status' && env.VERCEL_TOKEN != ''
        run: node scripts/production-guard.mjs wait "$SHA"
      - name: Read-only core smoke (one retry)
        id: smoke
        if: steps.wait.outputs.superseded != 'true'
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          FORCE_FAIL: ${{ inputs.force_fail && 'true' || '' }}
        run: |
          smoke() { if [ -n "$FORCE_FAIL" ]; then echo "FAIL forced by dispatch"; return 1; fi; node scripts/smoke-core.mjs; }
          smoke | tee smoke.txt && exit 0
          sleep 60
          smoke | tee smoke.txt
      - name: Roll production back
        if: failure() && steps.smoke.outcome == 'failure' && github.event_name == 'deployment_status' && env.VERCEL_TOKEN != ''
        run: node scripts/production-guard.mjs rollback "$SHA" 2>&1 | tee rollback.txt
      - name: Open core bug
        if: failure() && !inputs.force_fail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          smoke=$(grep -E '^(PASS|FAIL)' smoke.txt 2>/dev/null || echo "smoke did not run; see the run log")
          rollback=$(cat rollback.txt 2>/dev/null || echo "not attempted (scheduled run, wait failed, or no VERCEL_TOKEN)")
          gh issue create -R "$GITHUB_REPOSITORY" -l core -l bug -l owner:devops \
            -t "Production smoke failed on ${SHA::7} ($GITHUB_EVENT_NAME)" \
            -b "$(printf 'Run: %s\n\nSmoke:\n```\n%s\n```\nRollback:\n```\n%s\n```\nRecovery: docs/RELEASING.md#production-guard\n' "$run" "$smoke" "$rollback")"
