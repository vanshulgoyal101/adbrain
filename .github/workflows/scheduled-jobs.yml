name: Scheduled jobs
on:
  # Backup scheduler and the only place that opens alert issues. Supabase pg_cron runs the jobs on
  # time (#274); GitHub delays or drops these schedules (often hours apart), so never rely on them.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # #1893: CRON_SECRET lives only in this main-only environment, so a dispatch from another branch gets no secret.
    environment: production-secrets
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      BASE: https://adbrain.vanshul.com
    steps:
      - name: Scheduler health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET is not set"; exit 1; }
          # First, so this run's own calls below don't hide a stopped pg_cron.
          code=$(curl -sS --max-time 30 -o scheduler.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/scheduler-health") || code=000
          echo "HTTP $code $(jq -c '{ok, jobs: [.jobs[]? | {job, lastRunMinutesAgo, lastSuccessMinutesAgo, overdue}], error}' scheduler.json 2>/dev/null || echo '{"ok":false,"error":"no JSON body"}')"
          [ "$code" = 200 ]
          # One open issue per overdue job (no successful run in twice its interval); the job stays green.
          for job in $(jq -r '.jobs[]? | select(.overdue) | .job' scheduler.json); do
            [[ "$job" =~ ^[a-z-]+$ ]] || continue
            title="Scheduled job overdue: $job"
            open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq length)
            [ "$open" = 0 ] || continue
            gh issue create -R "$GITHUB_REPOSITORY" -l core -l bug -l owner:devops -t "$title" \
              -b "$(printf 'No successful %s run in twice its interval: %s\n\nCheck pg_cron and the Vault secret first, then the route: docs/operations/scheduled-jobs.md#scheduled-jobs\nRun: %s/%s/actions/runs/%s\n' "$job" "$(jq -c --arg job "$job" '.jobs[] | select(.job == $job)' scheduler.json)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          done
      - name: Spend enforcement
        id: spend
        if: always()
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET is not set"; exit 1; }
          code=$(curl -sS --max-time 75 -o spend.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/enforce-spend") || code=000
          # Public repo: log counts only, never business IDs.
          echo "HTTP $code $(jq -c '{ok, paused: ([.swept[]?.paused[]] | length), unverified: (.unverified // [] | length), error}' spend.json 2>/dev/null || echo '{"ok":false,"error":"no JSON body"}')"
          [ "$code" = 200 ]
      - name: Lead sync
        if: always()
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET is not set"; exit 1; }
          code=$(curl -sS --max-time 75 -o leads.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/sync-leads") || code=000
          echo "HTTP $code $(jq -c '{ok, imported, businesses: (.businesses // [] | length), failed: ([.businesses[]? | select(.error)] | length), hasMore: ([.businesses[]? | select(.sync.hasMore)] | length), error}' leads.json 2>/dev/null || echo '{"ok":false,"error":"no JSON body"}')"
          [ "$code" = 200 ]
      - name: Payment webhook health
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET is not set"; exit 1; }
          code=$(curl -sS --max-time 30 -o payments.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/payment-health") || code=000
          echo "HTTP $code $(jq -c '{ok, payments, events7d, unprocessed, capturedWithoutEvent, error}' payments.json 2>/dev/null || echo '{"ok":false,"error":"no JSON body"}')"
          [ "$code" = 200 ]
          # A capture without its webhook event, or an event stuck unprocessed: open one issue, keep the job green.
          [ "$(jq -r '.ok' payments.json)" = false ] || exit 0
          title="Razorpay webhook missing for a captured payment"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq length)
          [ "$open" = 0 ] || exit 0
          gh issue create -R "$GITHUB_REPOSITORY" -l core -l bug -l owner:devops -t "$title" \
            -b "$(printf 'Payment health: %s\n\nA captured payment has no capture webhook event after 30 minutes, or an event is unprocessed after an hour. Check the Razorpay webhook settings and reconcile the order (no charges).\n\nRun: %s/%s/actions/runs/%s\nRunbook: docs/operations/scheduled-jobs.md#scheduled-jobs\n' "$(jq -c '{events7d, unprocessed, capturedWithoutEvent}' payments.json)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
      - name: Pilot settings (#1875)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET is not set"; exit 1; }
          code=$(curl -sS --max-time 30 -o pilot.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/pilot-readiness") || code=000
          # Names and states only; the route never returns values.
          echo "HTTP $code $(jq -c '{ok, missing: [.missing[]? | "\(.name) (\(.state))"], error}' pilot.json 2>/dev/null || echo '{"ok":false,"error":"no JSON body"}')"
          [ "$code" = 200 ]
          lines=$(jq -r '.missing[]? | "- `\(.name)`: \(.state), needed for \(.why)"' pilot.json)
          [ -n "$VERCEL_TOKEN" ] || lines=$(printf '%s\n%s' "$lines" '- `VERCEL_TOKEN` (GitHub Actions secret): missing, needed for the deploy guard and drift check')
          lines=$(printf '%s' "$lines" | grep -E '^- `[A-Z_ |]+`' || true)
          [ -n "$lines" ] || exit 0
          title="Pilot settings missing in production"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq length)
          [ "$open" = 0 ] || exit 0
          gh issue create -R "$GITHUB_REPOSITORY" -l core -l owner:devops -t "$title" \
            -b "$(printf 'These production settings are missing or switched off (names only, never values):\n\n%s\n\nSet them in Vercel production (or the GitHub secret), redeploy, and close this issue; the next run reopens it if anything is still missing.\nRun: %s/%s/actions/runs/%s\nRunbook: docs/operations/scheduled-jobs.md#scheduled-jobs\n' "$lines" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
      - name: Campaign results and health
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET is not set"; exit 1; }
          code=$(curl -sS --max-time 75 -o results.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/refresh-results") || code=000
          # Public repo: counts, problem kinds and opaque keys only, never business or campaign IDs.
          echo "HTTP $code $(jq -c '{ok, refreshed, skipped, failed, hasMore, alerts: (.alerts // [] | length), error}' results.json 2>/dev/null || echo '{"ok":false,"error":"no JSON body"}')"
          # One issue per new problem (rejected ad, no delivery, ended run), even if the refresh was partial.
          for row in $(jq -r '.alerts[]? | "\(.kind):\(.key)"' results.json 2>/dev/null); do
            kind=${row%%:*}; key=${row#*:}
            [[ "$kind" =~ ^(rejected|not_delivering|ended)$ && "$key" =~ ^[a-f0-9]{12}$ ]] || continue
            seen=$(gh issue list -R "$GITHUB_REPOSITORY" --state all --search "in:title $key" --json number --jq length)
            [ "$seen" = 0 ] || continue
            gh issue create -R "$GITHUB_REPOSITORY" -l core -l bug -l owner:dev3 -t "Campaign needs attention: $kind ($key)" \
              -b "$(printf 'A live campaign needs attention: %s. The campaign shows a Needs attention badge in AdBrain with the reason.\n\nFind it (key %s): docs/operations/scheduled-jobs.md#scheduled-jobs\nRun: %s/%s/actions/runs/%s\n' "$kind" "$key" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          done
          [ "$code" = 200 ]
      - name: Meta reconnect needed (#758)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The spend, lead and results crons list owners whose Meta token is dead as `reauth: [{key, since, activeCampaigns}]`
          # (opaque key = sha256(business_id)[:12]). One open waiting-owner issue per key; the CEO asks the owner to reconnect.
          # Per file, so one missing or non-JSON response doesn't hide the others.
          rows=$(for f in spend.json leads.json results.json; do jq -c '.reauth[]?' "$f" 2>/dev/null || true; done \
            | jq -rs 'group_by(.key) | map({key: .[0].key, since: (map(.since) | min), active: (map(.activeCampaigns // 0) | max)}) | .[] | "\(.key)|\(.since)|\(.active)"' 2>/dev/null) || rows=""
          echo "reauth: $(printf '%s' "$rows" | grep -c . || true) owner(s)"
          while IFS='|' read -r key since active; do
            [[ "$key" =~ ^[a-f0-9]{12}$ && "$active" =~ ^[0-9]+$ && "$since" =~ ^[0-9T:.Z-]+$ ]] || continue
            open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"Meta reconnect needed ($key)\"" --json number --jq length)
            [ "$open" = 0 ] || continue
            gh issue create -R "$GITHUB_REPOSITORY" -l core -l waiting-owner -t "Meta reconnect needed ($key)" \
              -b "$(printf "An owner's Meta connection stopped working (token expired or revoked) since %s. Their leads don't sync, results go stale and the weekly cap can't be enforced until they reconnect.\nACTIVE campaigns: %s%s\n\n→ CEO: ask the owner to reconnect Meta in AdBrain (Settings → Meta). Find them (key %s): docs/operations/scheduled-jobs.md#scheduled-jobs\nRun: %s/%s/actions/runs/%s\n" \
                "$since" "$active" "$([ "$active" -gt 0 ] && echo ' (still delivering; Meta lifetime cap applies, ask today)')" "$key" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          done <<<"$rows"
      - name: Managed accounts (2-Tier provisioning, #527)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET is not set"; exit 1; }
          code=$(curl -sS --max-time 30 -o managed.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/managed-health") || code=000
          [ "$code" = 404 ] && { echo "managed-health not deployed yet"; exit 0; }
          # Public repo: states, minutes and opaque keys only.
          echo "HTTP $code $(jq -c '{ok, accounts, byState, stuck: (.stuck // [] | length), error}' managed.json 2>/dev/null || echo '{"ok":false,"error":"no JSON body"}')"
          for row in $(jq -r '.stuck[]? | "\(.state):\(.key):\(.minutes)"' managed.json 2>/dev/null); do
            IFS=: read -r state key minutes <<<"$row"
            [[ "$state" =~ ^[a-z_]+$ && "$key" =~ ^[a-f0-9]{12}$ && "$minutes" =~ ^[0-9]+$ ]] || continue
            seen=$(gh issue list -R "$GITHUB_REPOSITORY" --state all --search "in:title $key" --json number --jq length)
            [ "$seen" = 0 ] || continue
            gh issue create -R "$GITHUB_REPOSITORY" -l core -l bug -l 2tier -l owner:dev2 -t "Managed account stuck: $state ($key)" \
              -b "$(printf 'A 2-Tier managed account has been in `%s` for %s min (over 30). Resume or fail it, then check its step log.\n\nFind it (key %s): docs/operations/scheduled-jobs.md#scheduled-jobs\nRun: %s/%s/actions/runs/%s\n' "$state" "$minutes" "$key" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          done
          [ "$code" = 200 ]
      - name: Facebook access requests (#692)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET is not set"; exit 1; }
          code=$(curl -sS --max-time 30 -o access.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/access-requests") || code=000
          [ "$code" = 404 ] && { echo "access-requests not deployed yet"; exit 0; }
          # Public repo: an opaque key and hours only; the owner's name and number stay in the database.
          echo "HTTP $code $(jq -c '{ok, requests: (.requests // [] | length), more, error}' access.json 2>/dev/null || echo '{"ok":false,"error":"no JSON body"}')"
          # #725: at most 5 public issues a run; the rest wait for the next run, noted on the newest issue.
          opened=0; waiting=$(jq -r '.more // 0' access.json 2>/dev/null); [[ "$waiting" =~ ^[0-9]+$ ]] || waiting=0; last=""
          for row in $(jq -r '.requests[]? | "\(.key):\(.hours)"' access.json 2>/dev/null); do
            IFS=: read -r key hours <<<"$row"
            [[ "$key" =~ ^[a-f0-9]{12}$ && "$hours" =~ ^[0-9]+$ ]] || continue
            seen=$(gh issue list -R "$GITHUB_REPOSITORY" --state all --search "in:title $key" --json number --jq length)
            [ "$seen" = 0 ] || continue
            if [ "$opened" -ge 5 ]; then waiting=$((waiting + 1)); continue; fi
            opened=$((opened + 1))
            last=$(gh issue create -R "$GITHUB_REPOSITORY" -l core -l waiting-owner -t "Facebook access request ($key)" \
              -b "$(printf 'An outside owner tapped **Ask for Facebook access** %s h ago. The app told them: we will WhatsApp you within a working day.\n\n→ CEO: ask the owner to add them as a Tester on the Meta app (#679), then WhatsApp them.\nFind their name, business and WhatsApp number (key %s): docs/operations/scheduled-jobs.md#scheduled-jobs\nRun: %s/%s/actions/runs/%s\n' "$hours" "$key" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")")
          done
          if [ -n "$last" ] && [ "$waiting" -gt 0 ]; then
            gh issue comment "$last" -R "$GITHUB_REPOSITORY" --body "$waiting more access requests are waiting; the next runs open them."
          fi
          [ "$code" = 200 ]
      - name: Launch reconciliation (#734)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET is not set"; exit 1; }
          code=$(curl -sS --max-time 30 -o recon.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/campaign-reconciliation") || code=000
          [ "$code" = 404 ] && { echo "campaign-reconciliation not deployed yet"; exit 0; }
          # Public repo: minutes and opaque keys only.
          echo "HTTP $code $(jq -c '{ok, waiting, stuck: (.stuck // [] | length), error}' recon.json 2>/dev/null || echo '{"ok":false,"error":"no JSON body"}')"
          for row in $(jq -r '.stuck[]? | "\(.key):\(.minutes)"' recon.json 2>/dev/null); do
            IFS=: read -r key minutes <<<"$row"
            [[ "$key" =~ ^[a-f0-9]{12}$ && "$minutes" =~ ^[0-9]+$ ]] || continue
            seen=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title $key" --json number --jq length)
            [ "$seen" = 0 ] || continue
            gh issue create -R "$GITHUB_REPOSITORY" -l core -l bug -l owner:dev3 -t "Launch needs reconciliation ($key)" \
              -b "$(printf 'A campaign launch has waited in `needs_reconciliation` for %s min: Meta may hold a campaign AdBrain does not track.\n\nRead what Meta holds (read-only): `node scripts/reconcile-operation.mjs --key %s`. If the verdict is `active`, pause it in Ads Manager first. `nothing_live`: rerun with `--apply` to close it. `paused`: import or delete the tree, then rerun.\nRunbook: docs/operations/scheduled-jobs.md#scheduled-jobs\nRun: %s/%s/actions/runs/%s\n' "$minutes" "$key" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          done
          [ "$code" = 200 ]
      - name: Core scoreboard (#681, once a day after 03:00Z)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: "681"
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET is not set"; exit 1; }
          [ "$(date -u +%H)" -ge 3 ] || { echo "Before 03:00Z; posting later."; exit 0; }
          [ "$(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json state --jq .state)" = OPEN ] || { echo "#$ISSUE is closed."; exit 0; }
          posted=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments?since=$(date -u +%F)T00:00:00Z&per_page=100" \
            --jq '[.[] | select(.body | startswith("<!-- core-scoreboard -->")) | select(.created_at >= "'"$(date -u +%F)"'")] | length')
          [ "$posted" = 0 ] || { echo "Already posted today."; exit 0; }
          code=$(curl -sS --max-time 60 -o board.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/core-scoreboard") || code=000
          [ "$code" = 404 ] && { echo "core-scoreboard not deployed yet"; exit 0; }
          # Advisory: a missing scoreboard must not fail the scheduler.
          [ "$code" = 200 ] || { echo "::warning::core-scoreboard HTTP $code"; exit 0; }
          { printf '<!-- core-scoreboard -->\nDevOps (scheduled): '; jq -r '.markdown' board.json; } > board.md
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body-file board.md
      - name: Owner daily results on WhatsApp (#1022)
        if: always()
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET is not set"; exit 1; }
          code=$(curl -sS --max-time 60 -o daily.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/owner-daily-results") || code=000
          [ "$code" = 404 ] && { echo "owner-daily-results not deployed yet"; exit 0; }
          echo "HTTP $code $(jq -c '{ok, skipped, day, sent, results: ([.outcomes[]?.result] | group_by(.) | map({(.[0]): length}) | add)}' daily.json 2>/dev/null || echo '{\"ok\":false}')"
          # Advisory: dark behind OWNER_ALERTS_ENABLED; one owner's failure never fails the scheduler.
          exit 0
      - name: OpenRouter credit (#449) and AI key health (#1569)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET is not set"; exit 1; }
          code=$(curl -sS --max-time 30 -o credit.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/llm-credit") || code=000
          [ "$code" = 404 ] && { echo "llm-credit not deployed yet"; exit 0; }
          echo "HTTP $code $(jq -c '{ok, minRemainingUsd, thresholdUsd, low, failed: ([.keys[]? | select(.error)] | length), probed: ([.health[]?] | length), dead: (.dead // []), unknown: [.health[]? | select(.status == "unknown") | .name], models: ([.models[]?] | length), retired: (.retired // [])}' credit.json 2>/dev/null || echo '{"ok":false,"error":"no JSON body"}')"
          # #1569: one issue per AI key the provider refuses (401/402/403); env names only, never a key.
          dead=$(jq -r '.dead[]? // empty' credit.json 2>/dev/null | grep -E '^[A-Z_]+(\[[0-9]+\])?$' || true)
          while read -r name; do
            [ -n "$name" ] || continue
            title="AI key refused: $name"
            open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq length)
            [ "$open" = 0 ] || continue
            detail=$(jq -r --arg n "$name" '.health[]? | select(.name == $n) | "\(.provider) \(.detail)"' credit.json)
            gh issue create -R "$GITHUB_REPOSITORY" -l core -l bug -l owner:devops -t "$title" \
              -b "$(printf 'The ₹0 key probe (#1569) got a refusal for %s (%s). Calls fall back to other keys or providers until it is fixed.\n\n→ DevOps: rotate or remove it in Vercel Production, then close this.\nRun: %s/%s/actions/runs/%s\n' "$name" "$detail" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")" || true
          done <<< "$dead"
          # #1808: one issue per configured model id its provider no longer lists ("provider model"; ids only).
          retired=$(jq -r '.retired[]? // empty' credit.json 2>/dev/null | grep -E '^[a-z]+ [A-Za-z0-9@/._:-]+$' || true)
          while read -r entry; do
            [ -n "$entry" ] || continue
            title="AI model retired: $entry"
            open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq length)
            [ "$open" = 0 ] || continue
            gh issue create -R "$GITHUB_REPOSITORY" -l core -l bug -l owner:devops -t "$title" \
              -b "$(printf 'The model check (#1808) did not find %s on its provider'"'"'s /models list, so calls to it fail and fall back. Pick a listed model and set its env var in Vercel Production (or update the code default), then close this.\n\nRun: %s/%s/actions/runs/%s\n' "$entry" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")" || true
          done <<< "$retired"
          # Advisory: OpenRouter being unreachable must not fail the scheduler.
          [ "$(jq -r '.low' credit.json 2>/dev/null)" = true ] || exit 0
          title="OpenRouter credit low"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq length)
          [ "$open" = 0 ] || exit 0
          gh issue create -R "$GITHUB_REPOSITORY" -l decision -t "$title" \
            -b "$(printf 'An OpenRouter key has $%s left (alert under $%s, #449). Paid Create models (images, Haiku concepts) stop when it runs out.\n\n→ CEO: ask the owner whether to raise the key limit (OpenRouter settings → Keys).\nRun: %s/%s/actions/runs/%s\n' "$(jq -r '.minRemainingUsd' credit.json)" "$(jq -r '.thresholdUsd' credit.json)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
      # Moved from production-guard (#1893): the guard runs on Vercel's SHA-ref deployments, which a main-only environment can't serve.
      - name: 2-Tier parent token (#520)
        if: always()
        run: |
          [ -n "$CRON_SECRET" ] || { echo "CRON_SECRET not set; parent token check skipped"; exit 0; }
          code=$(curl -sS --max-time 30 -o parent.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" https://adbrain.vanshul.com/api/cron/meta-parent-health) || code=000
          # Codes only (public repo): never the token or Meta's message.
          summary=$(jq -c '{ok, configured, enabled, errorCode}' parent.json 2>/dev/null || echo '{"ok":false,"error":"no JSON body"}')
          echo "HTTP $code $summary"
          [ "$code" = 404 ] && { echo "Route not deployed yet; skipped"; exit 0; }
          [ "$code" = 200 ] && exit 0
          echo "FAIL 2-Tier parent token: HTTP $code $summary"
          exit 1
      # #1439: the WS1 first-timer path at 360 px over slow 4G, read-only on Meta. Gating since 5 green guard runs
      # (Oct 28): a failure turns the guard red and opens a core bug, but never rolls back (that needs the smoke to fail).
      # Skipped while the WS1_* secrets are unset.
      - name: Alert on the second consecutive failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh run list -R "$GITHUB_REPOSITORY" -w scheduled-jobs.yml --status completed -L 1 --json conclusion --jq '.[0].conclusion // ""')
          [ "$previous" = failure ] || { echo "First failure (previous: ${previous:-none}); alerting on the next one."; exit 0; }
          title="Scheduled jobs failed twice in a row"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq length)
          [ "$open" = 0 ] || exit 0
          gh issue create -R "$GITHUB_REPOSITORY" -l core -l bug -l owner:devops -t "$title" \
            -b "$(printf 'Scheduler health, spend enforcement, lead sync, payment health or results refresh failed on two consecutive runs.\n\nRun: %s/%s/actions/runs/%s\nRunbook: docs/operations/scheduled-jobs.md#scheduled-jobs\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
