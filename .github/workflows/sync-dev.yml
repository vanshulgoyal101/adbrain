name: Sync dev
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: sync-dev

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retry when someone pushes to dev between our fetch and push.
          for attempt in 1 2 3; do
            git fetch -q origin main dev
            git reset -q --hard origin/dev
            if git merge-base --is-ancestor origin/main HEAD; then echo "dev already contains main"; exit 0; fi
            if ! git merge -q --no-edit -m "Sync main $(git rev-parse --short origin/main) into dev" origin/main; then
              git diff --name-only --diff-filter=U | tee "$RUNNER_TEMP/conflicts.txt"
              git merge --abort
              exit 1
            fi
            git push -q origin HEAD:dev && { echo "dev now contains main $(git rev-parse --short origin/main)"; exit 0; }
          done
          exit 1
      - name: Alert once
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="dev cannot merge main automatically"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq length)
          [ "$open" = "0" ] || exit 0
          conflicts=$(cat "$RUNNER_TEMP/conflicts.txt" 2>/dev/null || echo "none recorded; see the run log")
          gh issue create -R "$GITHUB_REPOSITORY" -l bug -l owner:devops -t "$title" \
            -b "$(printf 'Conflicting files:\n```\n%s\n```\nRun: %s/%s/actions/runs/%s\nFix: merge origin/main into dev in a worktree, resolve, push dev, rerun this workflow.\n' "$conflicts" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
