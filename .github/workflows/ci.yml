name: CI
on:
  # `next` collects merged PRs; the deploy train promotes it to `main` (#461).
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  # The deploy train dispatches CI on next after merging main into it.
  workflow_dispatch:

concurrency:
  # A new push to a PR cancels its older run; pushes to main and next always finish.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# #1741: read-only unless a job asks for more; survives a repo-setting change.
permissions:
  contents: read

jobs:
  # All jobs run in parallel; build, test, core and secrets are required.
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR checks out its merge commit; HEAD^1 is the base it merged onto.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # #2386: a PR runs the tests its change reaches plus every test that scans files
      # (routes, docs, workflows) with fs; a non-module change runs it all, and next
      # runs it all. The rule lives in scripts/test.sh, which `npm run test:changed`
      # runs locally (#2490).
      - name: Unit tests
        env:
          EVENT: ${{ github.event_name }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            TEST_BASE=HEAD^1 bash scripts/test.sh --changed --shard="$SHARD/3"
          else
            bash scripts/test.sh --shard="$SHARD/3"
          fi

  metadb:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # test:meta-db replays historical schema blobs with git show
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: META_TEST_PG_BIN="$(pg_config --bindir)" npm run test:meta-db

  # Required check name stays `test` (#226). `if: always()` matters: without it a
  # failed or cancelled job skips `test`, and a skipped required check counts as passing.
  # `docs` gates too (#1918): an undocumented route or env key can't merge.
  test:
    needs: [lint, unit, metadb, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.lint.result }}" "${{ needs.unit.result }}" "${{ needs.metadb.result }}" "${{ needs.docs.result }}"; do
            [ "$r" = success ] || { echo "a test job did not succeed: $r"; exit 1; }
          done

  # Core loop regression gate (#110); required on main on its own (#111).
  core:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the generation hold check replays a historical schema blob with git show
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:core
      - name: Offline production-guard regressions (#2030)
        run: node --experimental-vm-modules --test scripts/production-guard.test.mjs
      # Generation quota holds on real Postgres: settled partial runs must not lock Create (#138).
      - run: META_TEST_PG_BIN="$(pg_config --bindir)" npm run test:meta-db -- --generation-only

  # Advisories are reported, not blocking: a new upstream CVE must not stop shipping.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check docs
        run: |
          npm ci
          node --test scripts/check-docs.test.mjs
          npm run docs:check

  # ADR-001 (#1792, #2070): import boundaries; the baseline in scripts/boundaries-baseline.json may only shrink.
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check boundaries
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            npm run boundaries -- --base "origin/$BASE_REF"
          else
            npm run boundaries
          fi

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

  # #417: axe, LCP and CLS on the public pages, this PR against its base on the same runner,
  # when a PR touches src/app, src/components or the gate itself. Not required; fails only if something got worse.
  # Owner screens need a database, so they stay on the local `npm run ui-gate` before/after.
  ui-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        run: |
          # #1850: dependency and Next config changes can grow the first-load JS too.
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(src/(app|components)/|scripts/(ui-gate|first-load-js)\.mjs$|\.github/workflows/ci\.yml$|package(-lock)?\.json$|next\.config\.[a-z]+$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "No change under src/app or src/components; nothing to compare."
          fi
      - if: steps.changed.outputs.ui == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Build this PR and its base
        if: steps.changed.outputs.ui == 'true'
        run: |
          npm ci
          npm run build
          git worktree add ../base "origin/$BASE_REF"
          (cd ../base && npm ci && npm run build)
      - name: Install Chromium
        if: steps.changed.outputs.ui == 'true'
        run: |
          timeout -k 30s 8m npx playwright install --with-deps chromium && exit 0
          echo "::warning::playwright install --with-deps did not finish in 8 min; installing Chromium without OS packages"
          timeout -k 30s 4m npx playwright install chromium
      - name: Compare public pages (base → this PR)
        if: steps.changed.outputs.ui == 'true'
        env:
          # #1850: intended growth; the label takes effect on a re-run of this job.
          BUNDLE_GROWTH_OK: ${{ contains(github.event.pull_request.labels.*.name, 'bundle-growth-ok') }}
        run: |
          (cd ../base && npx next start -p 3001 > ../base.log 2>&1 &)
          npx next start -p 3002 > ../head.log 2>&1 &
          for port in 3001 3002; do
            for _ in $(seq 60); do curl -sf -o /dev/null "http://localhost:$port/login" && break; sleep 1; done
          done
          # #1850: first-load JS of /, /login and /for/* may grow at most 10% (gzipped scripts each page loads).
          node scripts/first-load-js.mjs --base http://localhost:3001 --head http://localhost:3002 $([ "$BUNDLE_GROWTH_OK" = true ] && echo --allow)
          # The same (this PR's) gate script measures both, so only the app differs.
          node scripts/ui-gate.mjs --public-only --origin http://localhost:3001 --out ui-gate/base
          node scripts/ui-gate.mjs --public-only --origin http://localhost:3002 --compare ui-gate/base --out ui-gate/head
      - if: failure() && steps.changed.outputs.ui == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-gate
          path: ui-gate/
          retention-days: 7
