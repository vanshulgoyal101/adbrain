name: CI
on:
  # `next` collects merged PRs; the deploy train promotes it to `main` (#461).
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  # All jobs run in parallel; build, test, core and secrets are required.
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  metadb:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          # test:meta-db replays historical schema blobs with git show
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: META_TEST_PG_BIN="$(pg_config --bindir)" npm run test:meta-db

  # Required check name stays `test` (#226). `if: always()` matters: without it a
  # failed or cancelled job skips `test`, and a skipped required check counts as passing.
  test:
    needs: [lint, unit, metadb]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.lint.result }}" "${{ needs.unit.result }}" "${{ needs.metadb.result }}"; do
            [ "$r" = success ] || { echo "a test job did not succeed: $r"; exit 1; }
          done

  # Core loop regression gate (#110); required on main on its own (#111).
  core:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          # the generation hold check replays a historical schema blob with git show
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:core
      # Generation quota holds on real Postgres: settled partial runs must not lock Create (#138).
      - run: META_TEST_PG_BIN="$(pg_config --bindir)" npm run test:meta-db -- --generation-only

  # Advisories are reported, not blocking: a new upstream CVE must not stop shipping.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check docs
        run: |
          npm ci
          node --test scripts/check-docs.test.mjs
          npm run docs:check

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

  # #417: axe, LCP and CLS on the public pages, this PR against its base on the same runner,
  # when a PR touches src/app, src/components or the gate itself. Not required; fails only if something got worse.
  # Owner screens need a database, so they stay on the local `npm run ui-gate` before/after.
  ui-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(src/(app|components)/|scripts/ui-gate\.mjs$|\.github/workflows/ci\.yml$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "No change under src/app or src/components; nothing to compare."
          fi
      - if: steps.changed.outputs.ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build this PR and its base
        if: steps.changed.outputs.ui == 'true'
        run: |
          npm ci
          npm run build
          git worktree add ../base "origin/$BASE_REF"
          (cd ../base && npm ci && npm run build)
      - name: Install Chromium
        if: steps.changed.outputs.ui == 'true'
        run: |
          timeout -k 30s 8m npx playwright install --with-deps chromium && exit 0
          echo "::warning::playwright install --with-deps did not finish in 8 min; installing Chromium without OS packages"
          timeout -k 30s 4m npx playwright install chromium
      - name: Compare public pages (base → this PR)
        if: steps.changed.outputs.ui == 'true'
        run: |
          (cd ../base && npx next start -p 3001 > ../base.log 2>&1 &)
          npx next start -p 3002 > ../head.log 2>&1 &
          for port in 3001 3002; do
            for _ in $(seq 60); do curl -sf -o /dev/null "http://localhost:$port/login" && break; sleep 1; done
          done
          # The same (this PR's) gate script measures both, so only the app differs.
          node scripts/ui-gate.mjs --public-only --origin http://localhost:3001 --out ui-gate/base
          node scripts/ui-gate.mjs --public-only --origin http://localhost:3002 --compare ui-gate/base --out ui-gate/head
      - if: failure() && steps.changed.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-gate
          path: ui-gate/
          retention-days: 7
