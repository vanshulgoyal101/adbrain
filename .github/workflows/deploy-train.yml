name: Deploy train
on:
  # PRs merge into `next` (no Vercel deploy). This promotes `next` to `main` (one production
  # deploy) at most every 30 minutes, only when `next` is green (#461, Hobby: 100 deploys/day).
  push:
    branches: [next]
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: write # merging the train PR writes to main
  pull-requests: write
  checks: read
  issues: write
  actions: write # dispatches the drift check; a GITHUB_TOKEN merge triggers no workflows
  statuses: write # core-approval on the train PR (#1002)

concurrency:
  # A newer push replaces a waiting run, so one promotion carries everything merged meanwhile.
  group: deploy-train
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GAP_MINUTES: "30"
    steps:
      - name: Promote next to main
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          ahead=$(gh api "repos/$repo/compare/main...next" --jq '.ahead_by')
          [ "$ahead" -gt 0 ] || { echo "next has nothing main lacks."; exit 0; }
          # A hotfix or migration on main that next lacks would ship a merged tree no CI has seen.
          # Count changed files, not commits: every train leaves a merge commit on main that changes nothing.
          behind=$(gh api "repos/$repo/compare/next...main" --jq '.files | length')
          if [ "$behind" -gt 0 ]; then
            # A migration or hotfix landed on main. Merge it into next by PR: its head is main's commit,
            # which CI already checked on the push to main. Then dispatch CI on next's merged tree
            # (a GITHUB_TOKEN merge triggers no workflows); the check loop below waits for it.
            echo "main changes $behind file(s) next lacks; merging main into next."
            msha=$(gh api "repos/$repo/commits/main" --jq .sha)
            sync=$(gh pr list -R "$repo" --state open --base next --head main --json number --jq '.[0].number // empty')
            if [ -z "$sync" ]; then
              sync=$(gh pr create -R "$repo" --base next --head main --title "Train sync: main → next" \
                --body "Automatic: brings migrations and hotfixes on main into next before the next train (#461).")
              sync=${sync##*/}
            fi
            # Like the train PR (#1002): no workflow runs on this GITHUB_TOKEN PR, and main's commits already
            # passed core-approval to get there (#1020).
            gh api -X POST "repos/$repo/statuses/$msha" -f state=success -f context=core-approval \
              -f description="Train sync: main's commits were gated into main" >/dev/null
            merged=""
            for i in $(seq 1 20); do
              if gh pr merge "$sync" -R "$repo" --merge --match-head-commit "$msha"; then merged=1; break; fi
              if [ "$(gh pr view "$sync" -R "$repo" --json mergeable --jq .mergeable)" = "CONFLICTING" ]; then break; fi
              sleep 30
            done
            if [ -z "$merged" ]; then
              echo "Could not merge main into next (#$sync: conflict or main's checks not green). Fix #$sync or merge main into next by a person's PR." > "$RUNNER_TEMP/reason"
              echo "::error::$(cat "$RUNNER_TEMP/reason")"; exit 1
            fi
            gh workflow run ci.yml -R "$repo" --ref next
            sleep 20
          fi
          # At most one production deploy per GAP_MINUTES.
          last=$(gh pr list -R "$repo" --state merged --base main --head next --limit 1 --json mergedAt --jq '.[0].mergedAt // empty')
          if [ -n "$last" ]; then
            wait=$(jq -rn --arg t "$last" --argjson gap "$GAP_MINUTES" '($gap * 60) - (now - ($t | fromdateiso8601)) | floor')
            if [ "$wait" -gt 0 ]; then echo "Last train left at $last; waiting ${wait}s."; sleep "$wait"; fi
          fi
          # Advisory only (#461): GitHub's count isn't what Vercel limits; git-triggered deploys kept succeeding past it.
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          used=$(gh api "repos/$repo/deployments?environment=Production&per_page=100" --jq "[.[] | select(.created_at >= \"$since\")] | length")
          echo "production deploys in last 24h (GitHub, advisory): $used"
          # Hold only on Vercel's real answer: the newest production deploy failed less than an hour ago.
          last=$(gh api "repos/$repo/deployments?environment=Production&per_page=1" --jq '.[0].id // empty')
          if [ -n "$last" ]; then
            read -r state age desc < <(gh api "repos/$repo/deployments/$last/statuses?per_page=1" \
              --jq '.[0] | "\(.state) \((now - (.created_at | fromdateiso8601)) / 60 | floor) \(.description // "" | gsub("\\s+"; "_"))"')
            echo "newest production deploy: $state, ${age} min ago"
            if [[ "$state" =~ ^(failure|error)$ ]] && [ "$age" -lt 60 ]; then
              echo "Vercel refused or failed the last production deploy ${age} min ago (${desc//_/ }); holding for an hour." > "$RUNNER_TEMP/reason"
              echo "::error::$(cat "$RUNNER_TEMP/reason")"; exit 1
            fi
          fi
          sha=$(gh api "repos/$repo/commits/next" --jq .sha)
          echo "Promoting next at ${sha::7} ($ahead commits)."
          # Required checks must be green on that exact commit (CI runs on every push to next).
          for i in $(seq 1 60); do
            # A run GitHub cancelled (a newer run on the same commit replaced it) can still report test=failure
            # from its always() aggregate job (#983); its suite is "cancelled", so leave it out.
            runs=$(gh api "repos/$repo/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "build" or .name == "test" or .name == "core" or .name == "secrets") | {name, state: (.conclusion // .status), suite: .check_suite.id}]')
            cancelled=$(gh api "repos/$repo/commits/$sha/check-suites?per_page=100" --jq '[.check_suites[] | select(.conclusion == "cancelled") | .id]')
            states=$(jq -rn --argjson runs "$runs" --argjson cancelled "$cancelled" '[$runs[] | . as $r | select($cancelled | index($r.suite) | not) | "\(.name)=\(.state)"] | unique | join(" ")')
            echo "checks: ${states:-none yet}"
            if grep -Eq '=(failure|cancelled|timed_out|action_required)' <<<"$states"; then echo "::error::next ${sha::7} is red; not promoting."; exit 1; fi
            [ "$(grep -o '=success' <<<"$states" | wc -l)" -eq 4 ] && break
            [ "$i" -lt 60 ] || { echo "::error::checks on ${sha::7} did not finish in 30 min"; exit 1; }
            sleep 30
          done
          pr=$(gh pr list -R "$repo" --state open --base main --head next --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create -R "$repo" --base main --head next --title "Deploy train $(date -u +%H:%MZ): next → main" \
              --body "Automatic promotion of \`next\` (${sha::7}) to production (#461). Merged PRs: see the commits.")
            pr=${pr##*/}
          fi
          # core-approval.yml never runs for this PR (a GITHUB_TOKEN-opened PR triggers no workflows), and
          # its rule passes every next → main PR anyway: each PR was gated into next (#1002). Set it here.
          gh api -X POST "repos/$repo/statuses/$sha" -f state=success -f context=core-approval \
            -f description="Deploy train: its PRs were gated into next" >/dev/null
          # A merge commit keeps next's history, so the next train needs no rebase.
          # A just-created PR can briefly report its green checks as "expected" (#608). Its pull_request CI can
          # also fail with 0 jobs when the merge ref isn't ready yet (#878): that's GitHub, not a red build, so
          # rerun it once. A PR CI failure that ran jobs is a real failure and stops the train at once.
          # This PR's own pull_request runs (actor github-actions[bot]) never start jobs; when the PR merges they end
          # as 0-job failures and email the owner every train. They add nothing (next's checks above are the gate),
          # so cancel any that haven't started; a cancelled run sends no failure email.
          sleep 10
          for rid in $(gh api "repos/$repo/actions/runs?head_sha=$sha&event=pull_request&per_page=50" \
              --jq '.workflow_runs[] | select(.status != "completed" and .actor.login == "github-actions[bot]") | .id'); do
            gh run cancel "$rid" -R "$repo" >/dev/null 2>&1 || true
          done
          merged=""; rerun=""
          for i in $(seq 1 30); do
            if gh pr merge "$pr" -R "$repo" --merge --match-head-commit "$sha"; then merged=1; break; fi
            run=$(gh api "repos/$repo/actions/runs?head_sha=$sha&event=pull_request&per_page=20" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last // empty | "\(.id) \(.status) \(.conclusion)"')
            read -r rid rstatus rconclusion <<<"$run"
            if [ -n "$rid" ] && [ "$rstatus" = completed ] && [ "$rconclusion" = failure ]; then
              jobs=$(gh api "repos/$repo/actions/runs/$rid/jobs" --jq .total_count)
              if [ "$jobs" != 0 ]; then echo "::error::pull_request CI $rid on ${sha::7} failed; not promoting."; exit 1; fi
              if [ -z "$rerun" ]; then
                echo "pull_request CI $rid has 0 jobs (merge ref not ready); rerunning it once."
                gh run rerun "$rid" -R "$repo" && rerun=1
              fi
            fi
            sleep 20
          done
          [ -n "$merged" ] || { echo "::error::#$pr was not mergeable within 10 min."; exit 1; }
          echo "Promoted ${sha::7} via #$pr."
          gh workflow run production-drift.yml -R "$repo" --ref main || echo "::warning::drift check not dispatched"
      - name: Alert once when the train is stuck
        if: failure()
        run: |
          title="Deploy train stuck"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          reason=$(cat "$RUNNER_TEMP/reason" 2>/dev/null || echo "Red or slow checks on next, or a merge error.")
          body="$(printf 'next could not be promoted to main. %s\n\nRun: %s/%s/actions/runs/%s\nFix next, or ship a hotfix PR to main (DevOps/CTO). Runbook: docs/RELEASING.md#deploy-train\n' "$reason" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          if [ -n "$open" ]; then gh issue comment "$open" -R "$GITHUB_REPOSITORY" -b "$body"
          else gh issue create -R "$GITHUB_REPOSITORY" -l core -l bug -l owner:devops -t "$title" -b "$body"; fi
