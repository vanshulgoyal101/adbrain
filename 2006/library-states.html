<style>
  @font-face { font-family: "DM Sans"; src: url("../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root { color-scheme: only light; --canvas: #f6f7f4; --ink: #1b2420; --muted: #5a6660; --line: #e2e6df; --leaf: #13784a; --amber: #a15c07; --red: #b42318; --ghost: #eef0ec; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.5 "DM Sans", "Noto Sans Devanagari", "Kohinoor Devanagari", sans-serif; }
  :lang(hi) { line-height: 1.6; }

  .intro p { margin-top: 8px; color: var(--muted); }
  .boards { display: grid; grid-template-columns: repeat(auto-fit, 390px); gap: 24px; padding: 0 24px 24px; align-items: start; }

  .content > * + * { margin-top: 16px; }
  .heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-weight: 600; text-align: center; background: white; }
  .primary { color: white; background: var(--leaf); border-color: var(--leaf); }
  .full { display: flex; width: 100%; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { min-height: 44px; display: flex; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 24px; font-size: 13px; }
  .tab.selected { background: var(--ink); color: white; border-color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 6px; list-style: none; padding: 0; }
  .tile { min-width: 0; }
  .thumb { aspect-ratio: 1; background: var(--ghost); border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; color: var(--muted); overflow: hidden; }
  .thumb svg.ph { width: 30px; height: 30px; }
  .badge { position: absolute; top: 4px; left: 4px; background: white; padding: 0 5px; border-radius: 4px; font-size: 11px; line-height: 18px; }
  .greyed .thumb > svg, .greyed .badge { opacity: .45; }
  .bar6 { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.9); }
  .bar6 i { display: block; height: 100%; width: 58%; border-radius: 4px; background: var(--leaf); }
  .tile .name { font-size: 13px; padding: 4px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { display: flex; gap: 4px; align-items: baseline; font-size: 13px; font-weight: 600; padding: 0 2px; }
  .status::before { content: ""; flex: 0 0 8px; height: 8px; border-radius: 50%; transform: translateY(-1px); }
  .ready { color: var(--leaf); } .ready::before { background: var(--leaf); }
  .busy { color: var(--muted); } .busy::before { border: 2px solid var(--muted); }
  .warn { color: var(--amber); } .warn::before { background: var(--amber); border-radius: 2px; }
  .blocked { color: var(--red); } .blocked::before { background: var(--red); border-radius: 0; transform: translateY(-1px) rotate(45deg) scale(.85); }
  .edge-warn .thumb { box-shadow: inset 0 0 0 2px var(--amber); }
  .edge-blocked .thumb { box-shadow: inset 0 0 0 2px var(--red); }
  .skel .thumb { background: linear-gradient(90deg, var(--ghost) 0 40%, #f6f7f4 50%, var(--ghost) 60% 100%) var(--ghost); background-size: 300% 100%; }
  .skel .line { height: 10px; margin: 8px 2px 0; border-radius: 4px; background: var(--ghost); }
  .skel .line.short { width: 55%; margin-top: 6px; }
  .panel { padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--canvas); }
  .panel > * + * { margin-top: 8px; }
  .tips { padding-left: 0; list-style: none; counter-reset: tip; }
  .tips li { counter-increment: tip; display: grid; grid-template-columns: 24px 1fr; gap: 8px; font-size: 14px; }
  .tips li + li { margin-top: 10px; }
  .tips li::before { content: counter(tip); width: 24px; height: 24px; border-radius: 50%; background: white; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .empty-art { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .empty-art span { aspect-ratio: 1; border: 1.5px dashed var(--line); border-radius: 8px; }
  .alert { border-left: 2px solid var(--red); padding-left: 12px; }
  .alert .head { color: var(--red); font-weight: 600; }
  .alert .button { margin-top: 12px; }
  .live { font-size: 13px; color: var(--muted); }
  .note { color: var(--muted); font-size: 13px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .note b { color: var(--ink); }
  .proposed { background: #fff6e5; border-radius: 3px; padding: 0 2px; }
  svg { fill: none; stroke: currentColor; stroke-width: 1.5; }
  @media (max-width: 437px) { .intro { padding: 20px 16px; } .boards { grid-template-columns: minmax(0, 1fr); padding: 0; } .frame { border-radius: 0; } }
</style>
